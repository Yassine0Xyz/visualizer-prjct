name: Flutter Android profile APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Analyze, test, and build profile APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.yaml') }}

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.yassine .

      - name: Set FFmpeg Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          updated, count = re.subn(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 24',
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one Flutter minSdk setting, found {count}')
          gradle.write_text(updated)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build profile APK
        run: flutter build apk --profile

      - name: Upload profile APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-visualizer-profile-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 14
